<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Games 🎮</title>

  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#2a1a2e;
      --muted:#7a6080;
      --card: rgba(255,255,255,0.72);
      --rounded: 24px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--ink);
      min-height:100vh;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(255,200,235,0.5) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(200,170,255,0.4) 0%, transparent 50%),
        linear-gradient(145deg, #f8d0e8 0%, #e0c0f0 40%, #d4b8f0 70%, #f0c8e0 100%);
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap{ max-width: 600px; margin: 0 auto; }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .title{
      font-family: "SF Pro Display", Inter, sans-serif;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #3a1a3e;
    }

    .back{
      text-decoration:none;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.5);
      padding: 10px 16px;
      border-radius: 999px;
      color: #3a1a3e;
      font-weight: 500;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .back:hover{ transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }

    .games-grid{
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .game-card{
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: var(--rounded);
      padding: 28px 24px;
      box-shadow: 0 12px 48px rgba(80,20,60,0.12);
      backdrop-filter: blur(20px);
      text-decoration: none;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transition: transform 0.25s cubic-bezier(0.4,0,0.2,1), box-shadow 0.25s ease;
      cursor: pointer;
    }
    .game-card:hover{
      transform: translateY(-4px);
      box-shadow: 0 16px 56px rgba(80,20,60,0.18);
    }

    .game-icon{
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .game-icon.puzzle{
      background: linear-gradient(135deg, #f0c0d8, #c4a8f0);
    }

    .game-name{
      font-family: "SF Pro Display", Inter, sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #3a1a3e;
    }

    .game-desc{
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.4;
    }

    .game-badge{
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(200,170,255,0.2);
      font-size: 11px;
      font-weight: 600;
      color: #6a4090;
    }

    @media (max-width: 480px){
      .topbar{ flex-direction: column; align-items: flex-start; gap: 8px; }
      .title{ font-size: 24px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <h1 class="title">Games 🎮</h1>
      <a class="back" href="index.html#questions">← Back</a>
    </div>

    <div class="games-grid">
      <a href="puzzle.html" class="game-card">
        <div class="game-icon puzzle">🧩</div>
        <div class="game-name">Picture Puzzle</div>
        <div class="game-desc">Unscramble our photos by sliding tiles back into place. How fast can you solve them all?</div>
        <div class="game-badge" id="streakBadge">🔥 Best streak: 0</div>
      </a>
    </div>
  </div>

  <script>
    const streak = parseInt(localStorage.getItem("puzzle-best-streak") || "0", 10);
    document.getElementById("streakBadge").textContent = "🔥 Best streak: " + streak;
  </script>
</body>
</html>
