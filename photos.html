<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Photos 💞📸</title>

  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink1: #f0a0d4;
      --purple1: #c4a8f0;
      --accent: #e46b8e;
      --card-bg: rgba(255,255,255,0.72);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(255,200,235,0.5) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(200,170,255,0.4) 0%, transparent 50%),
        linear-gradient(145deg, #f8d0e8 0%, #e0c0f0 40%, #d4b8f0 70%, #f0c8e0 100%),
        url("peonies.jpg") center/cover fixed no-repeat;
      padding: 24px 16px 32px;
      color: #2a1a2e;
      animation: fadeInPage 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-font-smoothing: antialiased;
    }

    @keyframes fadeInPage {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .page-shell {
      max-width: 960px;
      margin: 0 auto;
      background: rgba(255,255,255,0.68);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      box-shadow: 0 12px 48px rgba(80,20,60,0.12);
      border: 1px solid rgba(255,255,255,0.45);
      padding: 24px 22px 28px;
      position: relative;
      overflow: hidden;
    }

    .page-shell::before {
      content: "";
      position: absolute;
      inset: -40px;
      background: url("peonies.jpg") center/cover no-repeat;
      opacity: 0.08;
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: -1;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .title-block h1 {
      font-family: "SF Pro Display", system-ui;
      font-size: 24px;
      font-weight: 600;
      color: #3a1a3e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-block p { font-size: 13px; color: #7a6080; margin-top: 4px; }

    .scrapbook-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.6);
      border-radius: 999px;
      padding: 5px 12px;
      border: 1px dashed rgba(220,160,200,0.5);
      font-size: 11px;
      color: #7a3060;
      margin-top: 8px;
    }

    .back-btn {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(10px);
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.5);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      color: #3a1a3e;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .back-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    .gallery-grid {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 18px;
    }

    .photo-card {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(8px);
      border-radius: 22px;
      padding: 8px;
      box-shadow: 0 6px 24px rgba(80,20,60,0.1);
      border: 1px solid rgba(255,220,240,0.5);
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      position: relative;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .photo-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 32px rgba(80,20,60,0.15);
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .photo-tape {
      position: absolute;
      top: -7px;
      left: 16px;
      width: 38px;
      height: 12px;
      background: rgba(255,255,255,0.75);
      border-radius: 3px;
      transform: rotate(-5deg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .photo-frame {
      border-radius: 18px;
      overflow: hidden;
      background: #f0e0f0;
    }

    .photo-frame img {
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .photo-card:hover img {
      transform: scale(1.04);
    }

    .photo-heart {
      position: absolute;
      bottom: 10px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.7);
      font-size: 15px;
      transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .photo-card:hover .photo-heart {
      opacity: 1;
      transform: scale(1);
    }

    .photo-caption {
      margin-top: 8px;
      padding: 0 4px;
      font-size: 12px;
    }

    .photo-date {
      font-weight: 600;
      color: #5a2040;
    }

    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .lightbox.open { display: flex; }

    .lightbox-inner {
      max-width: 820px;
      width: 100%;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 16px;
      position: relative;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .lightbox-img-wrap img {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 12px;
    }

    .lightbox-close {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .lightbox-close:hover { background: rgba(0,0,0,0.8); }
  </style>
</head>

<body>
  <div class="page-shell">
    <div class="page-header">
      <div class="title-block">
        <h1>📱 Our Photos 💞</h1>
        <p>A little timeline of us — newest memories sort automatically.</p>
        <div class="scrapbook-tag">🌈 Scrapbook mode · tap any photo to zoom in</div>
      </div>

      <!-- changed to go directly to questions mode -->
      <a href="index.html#questions" class="back-btn">← Back to questions</a>
    </div>

    <div id="gallery" class="gallery-grid"></div>
  </div>

  <!-- LIGHTBOX VIEWER -->
  <div id="lightbox" class="lightbox">
    <div class="lightbox-inner">
      <button id="closeLightbox" class="lightbox-close">×</button>
      <div class="lightbox-img-wrap">
        <img id="lightboxImg" src="" alt="photo">
      </div>
      <div id="lightboxDate" style="margin-top: 10px; font-weight:600; color:#5a2040; font-size:14px;"></div>
    </div>
  </div>

  <script>
    // ⭐ Your files
    const photosData = [
      "2025-04-04-diversity.jpg",
      "2025-04-17-timeout.jpg",
      "2025-07-04-rooftop.jpg",
      "2025-10-12-club.jpg",
      "2025-10-16-date.jpg",
      "2024-06-20-first-date.jpg",
      "2024-06-30-first-time-over.jpg",
      "2024-07-13-satleen-bday.jpg",
      "2024-07-19-panorama-room.jpg",
      "2024-07-20-panorama-room.jpg",
      "2024-07-25-cafe.jpg",
      "2024-07-28-gantry.jpg",
      "2024-09-06-bday.jpg",
      "2024-09-20-san-generero.jpg",
      "2024-10-05-jubilee.jpg",
      "2024-10-12-halloween-bar.jpg",
      "2024-10-14-pumpkin-patch.jpg",
      "2024-10-19-manhattan.jpg",
      "2024-10-25-toy-story.jpg",
      "2024-10-26-dylan-halloween.jpg",
      "2024-11-11-christmas.jpg",
      "2024-11-23-aabea.jpg",
      "2024-11-27-bryant-park.jpg",
      "2024-12-31-nye.jpg",
      "2025-01-18-city.jpg",
      "2025-02-01-barrister.jpg",
      "2025-02-28-cuddle.jpg",
      "2025-04-03-salsa.jpg",
      "2025-07-06-tao.jpg",
      "2025-09-14-cj-hendry.jpg",
      "2025-10-18-met-rooftop.jpg",
      "2025-10-31-lighthouse.jpg",
      "2025-11-22-karaoke.jpg"
    ];

    // ✅ Safe: parse date from filename as LOCAL date (no UTC bug)
    function getDateFromFilename(filename) {
      const [year, month, day] = filename.split("-").slice(0, 3).map(Number);
      return new Date(year, month - 1, day); // local time
    }

    // Format date to "Month Day, Year"
    function formatPrettyDate(date) {
      return date.toLocaleDateString("en-US", {
        month: "long",
        day: "numeric",
        year: "numeric"
      });
    }

    const gallery = document.getElementById("gallery");

    // store photo count for badge on main page
    try {
      localStorage.setItem("photoCount", String(photosData.length));
    } catch (e) {
      // ignore if localStorage not available
    }

    // ✅ Use safe date parsing for sort + display
    photosData
      .sort((a, b) => getDateFromFilename(b) - getDateFromFilename(a))
      .forEach((file, i) => {
        const dateObj = getDateFromFilename(file);
        const pretty = formatPrettyDate(dateObj);

        const card = document.createElement("div");
        card.className = "photo-card";
        card.style.animationDelay = (i * 0.06) + "s";

        card.innerHTML = `
          <div class="photo-tape"></div>
          <div class="photo-frame">
            <img src="photos/${file}" alt="">
            <div class="photo-heart">💗</div>
          </div>
          <div class="photo-caption">
            <div class="photo-date">${pretty}</div>
          </div>
        `;

        card.addEventListener("click", () => openLightbox(file, pretty));
        gallery.appendChild(card);
      });

    // LIGHTBOX
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");
    const lightboxDate = document.getElementById("lightboxDate");

    function openLightbox(file, dateStr) {
      lightboxImg.src = "photos/" + file;
      lightboxDate.textContent = dateStr;
      lightbox.classList.add("open");
    }

    document.getElementById("closeLightbox").onclick = () =>
      lightbox.classList.remove("open");

    lightbox.onclick = e => {
      if (e.target === lightbox) lightbox.classList.remove("open");
    };
  </script>
</body>
</html>
